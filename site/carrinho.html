<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho de Compras | R.P Wood Personalizados</title>
  <meta name="description" content="Gerencie os produtos selecionados no seu carrinho de compras e prossiga para a finalização com segurança." />
  <meta name="author" content="R.P Wood Personalizados" />
  <meta property="og:title" content="Carrinho de Compras | R.P Wood Personalizados" />
  <meta property="og:description" content="Gerencie os produtos selecionados no seu carrinho de compras e prossiga para a finalização com segurança." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ==================== PAGE HERO ==================== -->
  <section class="page-hero">
    <div class="page-hero-bg">
      <img src="/images/products-hero.png" alt="Produtos da R.P Wood" loading="eager" />
      <div class="page-hero-overlay"></div>
    </div>
    <div class="page-hero-content reveal">
      <h1 class="page-hero-title">Seu Carrinho</h1>
      <p class="page-hero-subtitle">Revise os produtos escolhidos antes de finalizar a sua compra.</p>
    </div>
  </section>

  <!-- ==================== CART CONTENT ==================== -->
  <section class="section cart-section">
    <div class="container" id="cart-content-area">
      <!-- Dynamically filled by JS -->
    </div>
  </section>

  <!-- Dynamic shared footer and WhatsApp FAB injected here -->

  <script type="module">
    import { initPage } from './js/shared.js';
    import { getCart, updateQuantity, removeFromCart, getCartTotal, formatPrice } from './js/cart.js';

    document.addEventListener('DOMContentLoaded', () => {
      initPage();

      const cartContentArea = document.getElementById('cart-content-area');

      // Listen to cart update events to sync navbar badge
      window.addEventListener('cart-updated', () => {
        renderCartPage();
      });

      function renderCartPage() {
        const cart = getCart();

        if (cart.length === 0) {
          cartContentArea.innerHTML = `
            <div class="cart-empty reveal">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              <h3>Seu carrinho está vazio</h3>
              <p>Navegue por nossa loja e adicione lindas peças em madeira esculpidas em CNC.</p>
              <a href="/produtos.html" class="btn btn-primary">Ver Produtos</a>
            </div>
          `;
          
          // Trigger reveal reveal animation
          const emptyReveal = cartContentArea.querySelector('.reveal');
          if (emptyReveal) emptyReveal.classList.add('visible');
          return;
        }

        const itemsHTML = cart.map(item => `
          <tr>
            <td>
              <div class="cart-item-info">
                <img src="${item.image}" alt="${item.name}" class="cart-item-img" />
                <div class="cart-item-meta">
                  <h4>${item.name}</h4>
                  <p>${item.description.substring(0, 50)}...</p>
                </div>
              </div>
            </td>
            <td>
              <div class="cart-qty-control">
                <button class="cart-qty-btn decrease-btn" data-id="${item.id}">-</button>
                <span class="cart-qty-val">${item.qty}</span>
                <button class="cart-qty-btn increase-btn" data-id="${item.id}">+</button>
              </div>
            </td>
            <td>
              <span class="cart-item-subtotal">${formatPrice(item.price * item.qty)}</span>
            </td>
            <td style="text-align: right;">
              <button class="cart-item-remove remove-btn" data-id="${item.id}" aria-label="Remover item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </td>
          </tr>
        `).join('');

        const total = getCartTotal();

        cartContentArea.innerHTML = `
          <div class="cart-container reveal">
            <div class="cart-table-wrapper">
              <table class="cart-table">
                <thead>
                  <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Subtotal</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsHTML}
                </tbody>
              </table>
              <div style="margin-top: 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                <a href="/produtos.html" class="btn btn-secondary" style="padding: 10px 20px; font-size: 13px;">
                  ‹ Continuar Comprando
                </a>
              </div>
            </div>

            <div class="cart-summary">
              <h3>Resumo do Pedido</h3>
              <div class="cart-summary-row">
                <span>Subtotal</span>
                <span>${formatPrice(total)}</span>
              </div>
              <div class="cart-summary-row">
                <span>Frete</span>
                <span style="color: var(--gold-copper); font-weight: 500; font-size: 0.85rem;">Calculado no checkout</span>
              </div>
              <div class="cart-summary-row total">
                <span>Total</span>
                <span>${formatPrice(total)}</span>
              </div>
              <button class="cart-btn-checkout" id="checkout-btn">
                <span>Ir para a Finalização</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </button>
            </div>
          </div>
        `;

        // Trigger reveal animation
        const reveal = cartContentArea.querySelector('.reveal');
        if (reveal) reveal.classList.add('visible');

        // Bind event listeners for quantity buttons
        cartContentArea.querySelectorAll('.decrease-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const item = cart.find(i => i.id === id);
            if (item) {
              updateQuantity(id, item.qty - 1);
            }
          });
        });

        cartContentArea.querySelectorAll('.increase-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const item = cart.find(i => i.id === id);
            if (item) {
              updateQuantity(id, item.qty + 1);
            }
          });
        });

        cartContentArea.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            removeFromCart(id);
          });
        });

        // Checkout redirect button
        const checkoutBtn = document.getElementById('checkout-btn');
        if (checkoutBtn) {
          checkoutBtn.addEventListener('click', () => {
            window.location.href = '/checkout.html';
          });
        }
      }

      // Initial render
      renderCartPage();
    });
  </script>
</body>
</html>
